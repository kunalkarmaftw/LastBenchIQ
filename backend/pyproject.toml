[project]
name = "lastbenchiq-backend"
version = "0.1.0"
requires-python = ">=3.11"

# ----------------------------------------------------------------------------
# Ruff — linting + formatting. Deliberately strict.
# The point of strictness here is that AI-generated code gets validated by the
# toolchain instead of by reading every line. A rule relaxed "just this once"
# removes exactly the check that was doing the work.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort — import ordering
    "B",         # bugbear — real bug patterns
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "ARG",       # unused arguments
    "SIM",       # simplify
    "TCH",       # type-checking imports
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "S",         # bandit — security
    "N",         # pep8-naming
    "ASYNC",     # async correctness
]
ignore = [
    "S101",   # assert — allowed, pytest uses it
    "B008",   # function call in default arg — FastAPI's Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ARG001"]   # hardcoded test passwords are fine
"alembic/**" = ["ALL"]                     # generated migrations

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------------
# mypy — strict. Catches the class of bug an LLM makes most often:
# a function that returns something subtly different from its signature.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "fitz.*", "pytesseract.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "unit: isolated logic, no database",
    "api: endpoint tests through the FastAPI test client",
    "slow: excluded from the fast feedback loop",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
